<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="40" font-size="23" font-weight="700" fill="#0f172a">Cluster Proportional Autoscaler &#8212; CoreDNS on EKS</text>
  <text x="40" y="62" font-size="13" fill="#64748b">Node count drives CoreDNS replica count. Steps &#9312;&#8211;&#9317; repeat every --poll-period-seconds (default 10s).</text>

  <!-- Legend -->
  <g font-size="12" fill="#334155">
    <rect x="40" y="80" width="14" height="14" rx="3" fill="#DC2626"/>
    <text x="60" y="91">AWS / eksctl action</text>
    <rect x="230" y="80" width="14" height="14" rx="3" fill="#2563EB"/>
    <text x="250" y="91">Kubernetes core (unmodified)</text>
    <rect x="470" y="80" width="14" height="14" rx="3" fill="#7C3AED"/>
    <text x="490" y="91">cluster-proportional-autoscaler Pod</text>
    <rect x="760" y="80" width="14" height="14" rx="3" fill="#B45309"/>
    <text x="780" y="91">CoreDNS (kube-system)</text>
  </g>

  <!-- ================= eksctl scale ================= -->
  <rect x="40" y="120" width="260" height="90" rx="10" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="58" y="146" font-size="13" font-weight="700" fill="#0f172a">eksctl scale nodegroup</text>
  <text x="58" y="168" font-size="12" fill="#334155">--nodes 4   (managed nodegroup)</text>
  <text x="58" y="188" font-size="12" fill="#334155">ASG launches EC2 &#8594; nodes join</text>
  <text x="58" y="204" font-size="11" fill="#64748b">(Cluster Autoscaler / Karpenter do this in prod)</text>

  <line x1="170" y1="210" x2="170" y2="250" stroke="#94A3B8" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ================= NODES ================= -->
  <rect x="40" y="250" width="260" height="110" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <rect x="52" y="262" width="120" height="22" rx="11" fill="#DBEAFE"/>
  <text x="112" y="277" font-size="11" fill="#1D4ED8" text-anchor="middle">kube-apiserver</text>
  <text x="58" y="306" font-size="14" font-weight="700" fill="#0f172a">Node objects</text>
  <text x="58" y="328" font-size="12" fill="#334155">N = schedulable node count</text>
  <text x="58" y="346" font-size="12" fill="#334155">C = &#931; .status.capacity.cpu</text>

  <!-- ================= CONFIGMAP ================= -->
  <rect x="40" y="400" width="260" height="150" rx="10" fill="#F0FDFA" stroke="#99F6E4"/>
  <rect x="52" y="412" width="190" height="22" rx="11" fill="#CCFBF1"/>
  <text x="147" y="427" font-size="11" fill="#0F766E" text-anchor="middle">ConfigMap: coredns-autoscaler</text>
  <text x="58" y="456" font-size="14" font-weight="700" fill="#0f172a">Scaling params</text>
  <text x="58" y="478" font-size="12" fill="#334155">linear: coresPerReplica,</text>
  <text x="58" y="494" font-size="12" fill="#334155">&#160;&#160;nodesPerReplica, min, max,</text>
  <text x="58" y="510" font-size="12" fill="#334155">&#160;&#160;preventSinglePointFailure</text>
  <text x="58" y="530" font-size="12" fill="#334155">&#8212; or &#8212; ladder: step pairs</text>
  <text x="58" y="546" font-size="11" fill="#64748b">re-read every poll &#8594; live edits</text>

  <!-- ================= CPA CONTROLLER ================= -->
  <rect x="380" y="220" width="270" height="300" rx="12" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="2"/>
  <rect x="392" y="232" width="246" height="24" rx="12" fill="#EDE9FE"/>
  <text x="515" y="248" font-size="12" fill="#6D28D9" text-anchor="middle" font-weight="700">cluster-proportional-autoscaler</text>

  <text x="515" y="284" font-size="12" fill="#334155" text-anchor="middle">&#9312; list Nodes &#8594; N, C</text>
  <text x="515" y="310" font-size="12" fill="#334155" text-anchor="middle">&#9313; read ConfigMap &#8594; params</text>

  <rect x="404" y="324" width="222" height="76" rx="8" fill="#ffffff" stroke="#C4B5FD"/>
  <text x="515" y="345" font-size="11" fill="#6D28D9" text-anchor="middle" font-weight="700">&#9314; compute desired replicas</text>
  <text x="515" y="365" font-size="11" fill="#334155" text-anchor="middle">linear: max(ceil(N/npr),</text>
  <text x="515" y="380" font-size="11" fill="#334155" text-anchor="middle">ceil(C/cpr)), clamp(min,max)</text>
  <text x="515" y="394" font-size="10" fill="#64748b" text-anchor="middle">2 nodes&#8594;2 &#160; 4 nodes&#8594;4 &#160; 6 nodes&#8594;6</text>

  <text x="515" y="424" font-size="12" fill="#334155" text-anchor="middle">&#9315; GET coredns .spec.replicas</text>
  <text x="515" y="448" font-size="12" fill="#334155" text-anchor="middle">&#9316; if desired &#8800; current:</text>
  <text x="515" y="464" font-size="12" fill="#334155" text-anchor="middle">UPDATE deployments/scale</text>
  <text x="515" y="492" font-size="11" fill="#64748b" text-anchor="middle">no metrics-server / Prometheus / HPA</text>

  <!-- ================= COREDNS ================= -->
  <rect x="720" y="220" width="240" height="300" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
  <rect x="732" y="232" width="180" height="22" rx="11" fill="#FEF3C7"/>
  <text x="822" y="247" font-size="11" fill="#B45309" text-anchor="middle">Deployment: coredns</text>
  <text x="740" y="276" font-size="13" font-weight="700" fill="#0f172a">&#9317; scale subresource write</text>
  <text x="740" y="294" font-size="12" fill="#334155">.spec.replicas = desired</text>

  <line x1="822" y1="308" x2="822" y2="330" stroke="#94A3B8" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="732" y="330" width="180" height="36" rx="8" fill="#ffffff" stroke="#FCD34D"/>
  <text x="822" y="353" font-size="12" fill="#334155" text-anchor="middle">ReplicaSet (k8s core)</text>

  <line x1="822" y1="366" x2="822" y2="388" stroke="#94A3B8" stroke-width="2" marker-end="url(#ah)"/>
  <g>
    <rect x="736" y="388" width="38" height="44" rx="6" fill="#FEF3C7" stroke="#FCD34D"/>
    <rect x="784" y="388" width="38" height="44" rx="6" fill="#FEF3C7" stroke="#FCD34D"/>
    <rect x="832" y="388" width="38" height="44" rx="6" fill="#FEF3C7" stroke="#FCD34D"/>
    <rect x="880" y="388" width="20" height="44" rx="6" fill="#FEF3C7" stroke="#FCD34D" opacity="0.5"/>
  </g>
  <text x="822" y="452" font-size="11" fill="#64748b" text-anchor="middle">CoreDNS Pods added / removed</text>
  <text x="822" y="470" font-size="11" fill="#64748b" text-anchor="middle">(soft anti-affinity spreads them</text>
  <text x="822" y="486" font-size="11" fill="#64748b" text-anchor="middle">across the new nodes)</text>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94A3B8"/>
    </marker>
    <marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <line x1="300" y1="300" x2="378" y2="285" stroke="#2563EB" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="300" y1="460" x2="378" y2="315" stroke="#0D9488" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="650" y1="360" x2="718" y2="280" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#ahp)"/>

  <!-- loop arrow -->
  <path d="M 515 520 Q 515 560 400 560 L 150 560 Q 100 560 100 552" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ahp)"/>
  <text x="320" y="580" font-size="11" fill="#7C3AED" text-anchor="middle">&#9318; sleep --poll-period-seconds, repeat</text>

  <!-- bottom note -->
  <rect x="40" y="600" width="920" height="66" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="58" y="624" font-size="12" fill="#334155">&#8226; Input is cluster SIZE (nodes + cores), never DNS query load. No metrics pipeline, no HPA object.</text>
  <text x="58" y="644" font-size="12" fill="#334155">&#8226; CPA writes coredns .spec.replicas directly. Never also put an HPA on coredns &#8212; they would fight.</text>
  <text x="58" y="662" font-size="11" fill="#64748b">&#8226; EKS manages CoreDNS as an add-on: an add-on UPDATE can reset replicas; CPA re-corrects on its next poll.</text>
</svg>
