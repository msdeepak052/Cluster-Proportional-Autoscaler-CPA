# Values for the upstream chart, as an alternative to the raw manifests/:
#
#   helm repo add cluster-proportional-autoscaler \
#     https://kubernetes-sigs.github.io/cluster-proportional-autoscaler
#   helm repo update
#   helm install coredns-autoscaler \
#     cluster-proportional-autoscaler/cluster-proportional-autoscaler \
#     -n kube-system -f helm/cpa-values.yaml
#
# The chart creates the same three pieces manifests/ do: the ServiceAccount
# + ClusterRole/ClusterRoleBinding (rbac.create), the params ConfigMap (from
# `config`), and the CPA Deployment (from `options`).
#
# NOTE: chart value keys occasionally move between chart versions. Run
# `helm show values cluster-proportional-autoscaler/cluster-proportional-autoscaler`
# for the resolved version if a key below is rejected.

image:
  repository: registry.k8s.io/cpa/cluster-proportional-autoscaler
  tag: v1.9.0

# Rendered into the CPA container's flags.
options:
  target: deployment/coredns   # KIND/NAME to resize
  namespace: kube-system       # where the target + ConfigMap live
  logLevel: 2
  # nodeLabels: "role=worker"   # count only matching nodes
  # pollPeriodSeconds: 10

# Rendered into the params ConfigMap. Exactly one of linear / ladder.
# Tuned so a 2 -> 4 -> 6 node resize moves CoreDNS (see 10-cpa-configmap-linear.yaml).
config:
  linear:
    coresPerReplica: 4
    nodesPerReplica: 1
    min: 2
    max: 10
    preventSinglePointFailure: true
    includeUnschedulableNodes: true
  # ladder:
  #   nodesToReplicas:
  #     - [1, 2]
  #     - [3, 3]
  #     - [5, 5]
  #   coresToReplicas:
  #     - [1, 2]
  #     - [8, 3]

rbac:
  create: true
serviceAccount:
  create: true

priorityClassName: system-cluster-critical

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi
