apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "coredns-autoscaler.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coredns-autoscaler.labels" . | nindent 4 }}
data:
  # Key is config.mode (linear or ladder). CPA re-reads this every poll, so a
  # `kubectl edit` here applies within one --poll-period-seconds. A later
  # `helm upgrade` will overwrite manual edits.
  {{ include "coredns-autoscaler.paramsKey" . }}: |-
    {{ include "coredns-autoscaler.params" . }}
